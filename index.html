<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141311">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Un Buen Día">
  <meta name="description" content="Temple diario, disciplina y claridad estoica.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <title>Un Buen Día</title>
  <style>
    :root{
      --bg:#141311;
      --surface:#1d1b18;
      --surface-hi:#26231e;
      --ink:#ece6da;
      --muted:#9b9284;
      --gold:#c9a56a;
      --gold-dim:#8b6f42;
      --crimson:#7a2e26;
      --border:#322d26;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:ui-serif,Georgia,"Times New Roman",serif;
      background:radial-gradient(circle at 50% 0%,#26211a 0%,#141311 58%,#0e0d0c 100%);
      padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
    }
    .wrap{max-width:620px;margin:0 auto;padding:26px 0 42px}
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px;
      font-family:system-ui,-apple-system,sans-serif;
      gap:10px;
      flex-wrap:wrap;
    }
    .brand{
      font-size:13px;
      letter-spacing:.2em;
      text-transform:uppercase;
      font-weight:700;
      color:var(--gold);
    }
    .header-right{display:flex;align-items:center;gap:10px}
    .day{font-size:12px;color:var(--muted);text-transform:capitalize}
    .notify-btn{
      background:var(--surface-hi);
      color:var(--gold);
      border:1px solid var(--gold-dim);
      padding:7px 13px;
      font-size:12px;
      font-weight:600;
      border-radius:999px;
      -webkit-tap-highlight-color:transparent;
    }
    .notify-btn.subscribed{
      background:transparent;
      color:var(--muted);
      border:1px solid var(--border);
    }
    .hero{
      position:relative;
      overflow:hidden;
      border-radius:24px;
      min-height:210px;
      background:linear-gradient(155deg,#2a231b 0%,#1b1815 55%,#2d1b18 100%);
      border:1px solid var(--border);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:22px 24px;
      margin-bottom:20px;
      box-shadow:0 18px 42px #00000066;
    }
    .hero-emblem{
      position:absolute;
      right:-18px;
      top:-18px;
      width:190px;
      height:190px;
      border-radius:50%;
      border:1px solid #c9a56a26;
      box-shadow:inset 0 0 40px #c9a56a14;
      pointer-events:none;
    }
