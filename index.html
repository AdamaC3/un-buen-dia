<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eee3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Un Buen Día">
  <meta name="description" content="Un pequeño momento de calma para empezar cada día.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <title>Un Buen Día</title>
  <style>
    :root{--ink:#26372f;--muted:#68786d;--cream:#f5f4ec;--sage:#dfe8da;--sage2:#b8cbb8;--gold:#b88c55}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-serif,Georgia,"Times New Roman",serif;background:linear-gradient(180deg,#e9eee3 0%,#f5f4ec 48%,#f4eee2 100%);padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom); }
    .wrap{max-width:620px;margin:0 auto;padding:28px 0 40px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-family:system-ui,sans-serif;gap:8px;flex-wrap:wrap}
    .brand{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:650;color:#52685a}
    .header-right{display:flex;align-items:center;gap:10px}
    .day{font-size:12px;color:var(--muted)}
    .notify-btn{background:#e1e9dd;color:#344c3b;padding:7px 12px;font-size:12px;border-radius:999px}
    .notify-btn.subscribed{background:transparent;color:#68786d;border:1px solid #d5dfd1}
    .hero{position:relative;overflow:hidden;border-radius:28px;min-height:245px;background:linear-gradient(180deg,#c9d8c8 0%,#e8d9b9 58%,#f4dfb9 100%);display:flex;align-items:flex-end;padding:24px;margin-bottom:22px;box-shadow:0 14px 36px #465d4720}
    .sun{position:absolute;width:112px;height:112px;border-radius:50%;background:#f7e8bd;right:17%;top:34px;box-shadow:0 0 55px #fff4d4a8}
    .hill{position:absolute;left:-10%;right:-10%;height:115px;bottom:-44px;border-radius:50% 50% 0 0;background:#91aa91}
    .hill.two{height:85px;bottom:-48px;left:30%;background:#78957d;opacity:.8}
    .bird{position:absolute;top:62px;left:18%;font:22px Georgia;color:#65786b;opacity:.8}
    .hero-label{position:relative;z-index:2;font:11px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#455b4c}
    .card{background:#fffdf7d9;border:1px solid #ffffffb8;border-radius:28px;padding:30px 25px 24px;box-shadow:0 16px 40px #344a3510;backdrop-filter:blur(8px)}
    .eyebrow{font:11px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#82917e;margin-bottom:20px}
    blockquote{font-size:clamp(27px,6vw,39px);line-height:1.22;letter-spacing:-.025em;margin:0 0 20px}
    .reflection{font:15px/1.65 system-ui,sans-serif;color:#647267;margin:0;padding-top:17px;border-top:1px solid #e7e8dc}
    .actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
    button{border:0;border-radius:999px;padding:12px 16px;font:13px system-ui,sans-serif;cursor:pointer}
    .primary{background:#526d59;color:white}.secondary{background:#edf1e8;color:#455c4a}
    button:active{transform:scale(.98)}
    nav{display:flex;gap:8px;margin:22px 0 14px;font-family:system-ui,sans-serif}
    .tab{background:transparent;color:#718075;padding:10px 14px}.tab.active{background:#e1e9dd;color:#344c3b}
    .section{display:none}.section.active{display:block}
    .section-title{font-size:21px;margin:18px 0 12px}
    .list{display:grid;gap:10px}
    .item{background:#fffdf7c9;border:1px solid #ffffffb8;border-radius:18px;padding:16px 17px}
    .item p{font-size:18px;line-height:1.35;margin:0 0 9px}
    .item small{font:11px system-ui,sans-serif;color:#829084}
    .item button{margin-top:10px;padding:8px 12px}
    .empty{font:14px/1.6 system-ui,sans-serif;color:#748176;background:#ffffff80;padding:18px;border-radius:18px}
    footer{text-align:center;font:12px system-ui,sans-serif;color:#879287;margin-top:28px}
    .toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#31483a;color:white;padding:11px 17px;border-radius:99px;font:13px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center;max-width:90vw}
    .toast.show{opacity:1}
  </style>

  <!-- OneSignal Web SDK v16 -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "TU_ONESIGNAL_APP_ID",
        serviceWorkerParam: { scope: "/un-buen-dia/" },
        serviceWorkerPath: "/un-buen-dia/OneSignalSDKWorker.js"
      });

      const btn = document.getElementById("notify-btn");
      const toastEl = document.getElementById("toast");

      function showNotifyToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        setTimeout(() => toastEl.classList.remove("show"), 3200);
      }

      function hasPermission() {
        const nativeGranted = ("Notification" in window) && Notification.permission === "granted";
        return Boolean(OneSignal.Notifications.permission || nativeGranted);
      }

      function updateNotifyButton() {
        if (!btn) return;
        if (hasPermission()) {
          btn.textContent = "🔔 Activas";
          btn.classList.add("subscribed");
        } else {
          btn.textContent = "🔔 Activar aviso diario";
          btn.classList.remove("subscribed");
        }
      }

      updateNotifyButton();
      setTimeout(updateNotifyButton, 800);
      OneSignal.Notifications.addEventListener("permissionChange", updateNotifyButton);
      OneSignal.User.PushSubscription.addEventListener("change", updateNotifyButton);

      if (btn) {
        btn.addEventListener("click", async () => {
          const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
          if (!isStandalone) {
            showNotifyToast("Primero tocá Compartir → Añadir a pantalla de inicio y abrila desde ahí.");
            return;
          }
          if (("Notification" in window) && Notification.permission === "denied") {
            showNotifyToast("Tenés las notificaciones bloqueadas en Ajustes > Notificaciones > Un Buen Día.");
            return;
          }
          if (hasPermission()) {
            await OneSignal.User.PushSubscription.optIn();
            updateNotifyButton();
            showNotifyToast("Notificaciones activas y sincronizadas.");
            return;
          }
          try {
            await OneSignal.Notifications.requestPermission();
            await OneSignal.User.PushSubscription.optIn();
          } catch (e) {
            showNotifyToast("No se pudo activar: " + (e?.message || "reintentá"));
          }
          updateNotifyButton();
        });
      }
    });
  </script>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">☼ Un Buen Día</div>
    <div class="header-right">
      <button class="notify-btn" id="notify-btn" type="button">🔔 Activar aviso diario</button>
      <div class="day" id="date"></div>
    </div>
  </header>
  <section class="hero" aria-label="Amanecer en la naturaleza">
    <div class="sun"></div><div class="bird">⌁　⌁</div><div class="hill"></div><div class="hill two"></div>
    <div class="hero-label">Respirá. Este día también es tuyo.</div>
  </section>
  <section class="card">
    <div class="eyebrow">Una pausa para el alma · <span id="number"></span></div>
    <blockquote id="quote"></blockquote>
    <p class="reflection" id="reflection"></p>
    <div class="actions">
      <button class="primary" id="favorite">♡ Guardar frase</button>
      <button class="secondary" id="share">Compartir</button>
      <button class="secondary" id="copy">Copiar</button>
    </div>
  </section>
  <nav>
    <button class="tab active" data-tab="today">Hoy</button>
    <button class="tab" data-tab="favorites">Favoritas</button>
    <button class="tab" data-tab="history">Días anteriores</button>
  </nav>
  <section class="section active" id="today"><p class="empty">No hace falta tener todo resuelto para dar un buen primer paso. Volvé a esta pausa cuando la necesites.</p></section>
  <section class="section" id="favorites"><h2 class="section-title">Tus frases guardadas</h2><div class="list" id="favorite-list"></div></section>
  <section class="section" id="history"><h2 class="section-title">Un camino de pequeños comienzos</h2><div class="list" id="history-list"></div></section>
  <footer>Hecho para acompañar tus mañanas, sin apuro. 🌿</footer>
</main>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
